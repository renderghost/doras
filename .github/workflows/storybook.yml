name: Storybook

# Publishes Storybook to GitHub Pages, when run by hand from the Actions tab.
# Vercel publishes it on every merge to main (vercel.json). This stays as a
# fallback: to make it the main route again, add back
#   push:
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel one that's under way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/storybook/storybook-static

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
